<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<title>영웅서기 2: 빙해의 검사</title>
<meta name="description" content="브라우저 버전">
<meta property="og:type" content="website">
<meta property="og:title" content="영웅서기 2: 빙해의 검사">
<meta property="og:description" content="브라우저 버전">
<meta property="og:url" content="https://lesanf.github.io/hero-lore-2-web/">
<meta property="og:locale" content="ko_KR">
<link rel="stylesheet" href="@css/hero.css">
<script src="@ts/hero.ts" defer></script>
</head>
<body>
<div id="stage"><canvas id="canvas" width="240" height="320"></canvas></div>
<div id="zone"></div>
<div id="stick"><div class="ring"></div><div class="knob"></div><span class="hint">WASD</span></div>
<div id="hud">
  <div class="top">
    <button class="key" data-key="CLR"><small>ESC</small>메뉴</button>
    <button class="key" data-key="*"><small>M</small>지도</button>
  </div>
  <div class="cluster">
    <button class="round big" data-key="5"><small>SPACE</small>공격</button>
    <button class="round s1" data-key="1"><small>1</small>스킬</button>
    <button class="round s3" data-key="3"><small>3</small>스킬</button>
    <button class="round s7" data-key="7"><small>7</small>스킬</button>
    <button class="round s9" data-key="9"><small>9</small>스킬</button>
    <button class="round item" data-key="0"><small>Q</small>아이템</button>
    <button class="round swap" data-key="#"><small>E</small>교체</button>
  </div>
</div>
<div id="status">
  <img id="logo" src="../assets/logo.png" alt="영웅서기 2: 빙해의 검사">
  <div id="bar"><div id="fill"></div></div>
  <small id="detail">불러오는 중</small>
  <pre id="notice"></pre>
</div>
</body>
</html>
