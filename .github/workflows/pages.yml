name: pages

on:
  workflow_dispatch:   # manual only while testing locally; re-add `push: branches: [main]` to go live again

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write   # prune old deployment records after each deploy

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust wasm toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: build/wie
          cache-on-failure: true
      - name: Fetch the game package from the skt-pkg release
        run: gh release download skt-pkg -p hero2.zip -O game.zip
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build (pinned wie core + overlay page)
        run: GAME=game.zip sh engine/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Keep only this deployment record
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          keep=$(gh api "repos/$REPO/deployments?environment=github-pages&per_page=1" --jq '.[0].id')
          for id in $(gh api "repos/$REPO/deployments?per_page=100" --jq '.[].id'); do
            [ "$id" = "$keep" ] && continue
            gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive >/dev/null
            gh api -X DELETE "repos/$REPO/deployments/$id"
          done
          echo "kept deployment $keep"
